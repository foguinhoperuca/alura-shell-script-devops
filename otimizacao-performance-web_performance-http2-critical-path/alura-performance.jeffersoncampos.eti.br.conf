server {
    listen 2020;
    root /var/www/alura-performance.jeffersoncampos.eti.br;
}

server {
    listen 3030;
    root /var/www/alura-performance.jeffersoncampos.eti.br;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    expires 1w; # general
    location assets {
        experires 1d;
        add_header Cache-Control public; # also can be private otherwise
    }
}
