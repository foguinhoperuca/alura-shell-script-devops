application: alura-optimization-jecampos
runtime: php55
api_version: 1
version: web

handlers:
  - url: /
    static_files: index.html
    upload: index.html
    expiration: 0s
    http_headers:
      #      Link: <assets/img/background-cidade-fundo.svg>; rel=preload; as=image
      Link: <assets/css/critico.css>; rel=preload; as=style, <assets/img/logo-alura.svg>; rel=preload; as=image, <assets/img/background-cidade-fundo.svg>; rel=preload; as=image

  - url: /assets
    static_dir: assets
    expiration: 365d
